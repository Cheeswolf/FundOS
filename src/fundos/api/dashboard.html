<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FundOS 投资组合运营台</title>
  <style>
    :root{--bg:#090f1d;--panel:#111a2c;--panel2:#162238;--line:#273650;--text:#edf3fb;--muted:#8ea0b9;--teal:#73d7c6;--amber:#e4bb72;--red:#ef8a91}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    aside{position:fixed;inset:0 auto 0 0;width:250px;padding:28px 22px;background:#0e1728;border-right:1px solid var(--line)}
    main{margin-left:250px;padding:34px 4vw 64px;max-width:1500px}.brand{font-size:23px;font-weight:800;letter-spacing:.02em}.brand span,.kicker{color:var(--teal)}
    .brand-note,.muted{color:var(--muted)}label{display:block;margin:34px 0 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}
    select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}
    .kicker{font-size:12px;font-weight:800;letter-spacing:.16em}.headline{font-size:34px;line-height:1.1;margin:8px 0 10px}.pill{display:inline-block;background:#153c38;color:#8ce4d6;padding:4px 10px;border-radius:999px;font-size:12px}
    .metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:26px 0}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.metric b{display:block;color:var(--teal);font-size:23px;margin-top:6px}
    nav{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:12px 0 22px;overflow:auto}.tab{border:0;background:none;color:var(--muted);padding:13px 16px;cursor:pointer;white-space:nowrap}.tab.active{color:var(--text);border-bottom:2px solid var(--teal)}
    section{display:none}section.active{display:block}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.card h2{margin:0 0 15px;font-size:17px}.empty{padding:28px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
    .bar{height:7px;border-radius:6px;background:#243249;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.stack{display:grid;gap:12px}.record{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:11px}.record h3{margin:0 0 7px}.positive{color:var(--teal)}.negative{color:var(--red)}canvas{width:100%;height:270px}
    @media(max-width:950px){aside{position:static;width:auto}main{margin:0;padding:24px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside><div class="brand"><span>◈</span> FundOS</div><div class="brand-note">投资组合运营系统</div><label for="product">当前产品</label><select id="product"></select><p class="brand-note" style="margin-top:28px">研究 · 风控 · 投委会 · 复盘<br>所有决策完整留痕</p></aside>
  <main>
    <div class="kicker">PORTFOLIO CONTROL CENTER</div><h1 class="headline" id="title">加载中</h1><div><span class="pill" id="status">—</span> <span class="muted" id="version"></span></div>
    <div class="metrics" id="metrics"></div>
    <nav><button class="tab active" data-tab="overview">组合总览</button><button class="tab" data-tab="research">投研观点</button><button class="tab" data-tab="risk">风险中心</button><button class="tab" data-tab="committee">投委会</button><button class="tab" data-tab="reviews">业绩复盘</button></nav>
    <section id="overview" class="active"></section><section id="research"></section><section id="risk"></section><section id="committee"></section><section id="reviews"></section>
  </main>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%'; const api=p=>fetch(p).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});
let productId='';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
function empty(t){return `<div class="empty">${esc(t)}</div>`} function table(rows,cols){if(!rows.length)return empty('暂无数据');return `<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[2]?c[2](r[c[0]]):r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function drawNav(canvas,rows){if(!rows.length)return;const dpr=devicePixelRatio||1,w=canvas.clientWidth,h=270;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const vals=rows.map(x=>x.nav),lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;c.strokeStyle='#73d7c6';c.lineWidth=2;c.beginPath();vals.forEach((v,i)=>{const x=18+i*(w-36)/Math.max(1,vals.length-1),y=18+(hi-v)*(h-36)/span;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
async function load(){const [detail,versions,perf,research,reviews]=await Promise.all([api(`/products/${productId}`),api(`/products/${productId}/versions`),api(`/products/${productId}/performance`),api(`/products/${productId}/research`),api(`/products/${productId}/reviews`)]);const published=versions.find(v=>v.status==='published'),snap=perf.snapshots[0],m=detail.investment_mandate;$('#title').textContent=detail.product.name;$('#status').textContent=published?'已发布':'未发布';$('#version').textContent=`当前版本 ${published?'V'+published.version_number:'—'} · 基准 ${detail.product.benchmark_symbol}`;$('#metrics').innerHTML=[['累计收益',pct(snap?.cumulative_return)],['基准收益',pct(snap?.benchmark_return)],['超额收益',pct(snap?.excess_return)],['最大回撤',pct(snap?.maximum_drawdown)],['风险等级',m?.risk_level||'—']].map(x=>`<div class="metric"><span class="muted">${x[0]}</span><b>${esc(x[1])}</b></div>`).join('');
const weights=published?.weights||[];$('#overview').innerHTML=`<div class="grid"><div class="card"><h2>组合净值</h2>${perf.nav.length?'<canvas id="navChart"></canvas>':empty('暂无净值数据')}</div><div class="card"><h2>当前资产配置</h2>${weights.map(w=>`<div style="margin:13px 0"><div>${esc(w.asset_symbol)} <b style="float:right">${pct(w.weight)}</b></div><div class="bar"><i style="width:${Number(w.weight)*100}%"></i></div></div>`).join('')||empty('暂无已发布配置')}</div></div><div class="card" style="margin-top:16px"><h2>投资说明书</h2><p>${esc(m?.objective||'暂无')}</p>${m?table([{a:m.max_single_asset_weight,b:m.min_cash_weight,c:m.max_turnover,d:m.maximum_stress_loss}],[['a','单资产上限',pct],['b','最低现金',pct],['c','最大换手',pct],['d','压力损失上限',pct]]):''}</div>`;if(perf.nav.length)drawNav($('#navChart'),perf.nav);
$('#research').innerHTML=research.length?`<div class="stack">${research.map(r=>`<article class="record"><div class="muted">${esc(r.as_of_date)} · ${esc(r.market_regime)} · 置信度 ${pct(r.confidence)}</div><h3>${esc(r.summary)}</h3>${table(r.asset_views,[['asset_symbol','资产'],['direction','方向'],['confidence','置信度',pct],['thesis','逻辑']])}<p class="muted">证据：${r.evidence.map(e=>`<a href="${esc(e.url)}" target="_blank" style="color:#73d7c6">${esc(e.title)}</a>`).join(' · ')}</p></article>`).join('')}</div>`:empty('暂无研究报告');
const workflows=await api('/products/'+productId+'/workflows').catch(()=>[]);$('#risk').innerHTML=workflows.length?`<div class="stack">${workflows.map(w=>`<article class="record"><h3>${esc(w.run.run_id)} · ${esc(w.run.state)}</h3>${table(w.risk_checks,[['rule_code','规则'],['passed','通过',v=>v?'是':'否'],['actual_value','实际值'],['limit_value','限制'],['message','说明']])}</article>`).join('')}</div>`:empty('暂无风险审查记录');$('#committee').innerHTML=workflows.filter(w=>w.committee_decision).length?table(workflows.filter(w=>w.committee_decision).map(w=>w.committee_decision),[['run_id','运行ID'],['decision','决策'],['rationale','依据'],['decided_by','决策人'],['created_at','时间']]):empty('暂无投委会决策');
$('#reviews').innerHTML=reviews.length?`<div class="stack">${reviews.map(r=>`<article class="record"><div class="muted">${esc(r.period_start)} — ${esc(r.period_end)}</div><h3>实际 ${pct(r.actual_return)} · 不调仓 ${pct(r.counterfactual_return)} · <span class="${r.rebalance_effect>=0?'positive':'negative'}">调仓效果 ${pct(r.rebalance_effect)}</span></h3><p>${esc(r.summary)}</p><p class="muted">改进：${esc(r.lessons)}</p>${table(r.view_outcomes,[['asset_symbol','资产'],['direction','原观点'],['realized_return','实际收益',pct],['was_correct','验证',v=>v?'正确':'偏差']])}</article>`).join('')}</div>`:empty('暂无复盘报告')}
async function init(){try{const products=await api('/products');if(!products.length){$('#title').textContent='尚未创建投资组合';$('#metrics').innerHTML='';$('#overview').innerHTML=empty('请先通过 API 或演示脚本创建产品');return}$('#product').innerHTML=products.map(p=>`<option value="${esc(p.product_id)}">${esc(p.name)}</option>`).join('');productId=products[0].product_id;$('#product').onchange=e=>{productId=e.target.value;load()};await load()}catch(e){$('#title').textContent='数据加载失败';$('#overview').innerHTML=empty('请确认 FundOS API 与数据库状态') }}init();
</script>
</body></html>
