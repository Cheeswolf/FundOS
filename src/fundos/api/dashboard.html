<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FundOS 投资组合运营台</title>
  <style>
    :root{--bg:#090f1d;--panel:#111a2c;--line:#273650;--text:#edf3fb;--muted:#8ea0b9;--teal:#73d7c6;--red:#ef8a91}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,"Segoe UI","Microsoft YaHei",sans-serif}
    aside{position:fixed;inset:0 auto 0 0;width:250px;padding:28px 22px;background:#0e1728;border-right:1px solid var(--line)}
    main{margin-left:250px;padding:34px 4vw 64px;max-width:1500px}.brand{font-size:23px;font-weight:800}.brand span,.kicker{color:var(--teal)}
    .brand-note,.muted{color:var(--muted)}label{display:block;margin:34px 0 8px;color:var(--muted);font-size:12px;letter-spacing:.1em}
    select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--text)}
    .kicker{font-size:12px;font-weight:800;letter-spacing:.16em}.headline{font-size:34px;line-height:1.1;margin:8px 0 10px}
    .pill{display:inline-block;background:#153c38;color:#8ce4d6;padding:4px 10px;border-radius:999px;font-size:12px}.pill.simulation{background:#4a3617;color:#f3cd84}
    .notice{margin:18px 0;padding:12px 15px;border:1px solid #66502a;border-radius:10px;background:#211b13;color:#e8c985}
    .metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:26px 0}.metric,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.metric b{display:block;color:var(--teal);font-size:23px;margin-top:6px}
    nav{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:12px 0 22px;overflow:auto}.tab{border:0;background:none;color:var(--muted);padding:13px 16px;cursor:pointer;white-space:nowrap}.tab.active{color:var(--text);border-bottom:2px solid var(--teal)}
    section{display:none}section.active{display:block}.grid{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.card h2{margin:0 0 15px;font-size:17px}.empty{padding:28px;color:var(--muted);text-align:center;border:1px dashed var(--line);border-radius:10px}
    table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px}
    .bar{height:7px;border-radius:6px;background:#243249;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}.stack{display:grid;gap:12px}.record{padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:11px}.record h3{margin:0 0 7px}.positive{color:var(--teal)}.negative{color:var(--red)}canvas{width:100%;height:270px}
    .form{display:grid;gap:11px}.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form input,.form textarea,.form select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:#0b1424;color:var(--text)}.form textarea{min-height:90px;resize:vertical}.btn{border:1px solid #39796f;border-radius:8px;background:#153c38;color:#a6eee2;padding:9px 13px;cursor:pointer}.btn.danger{border-color:#85434b;background:#3b2025;color:#f4aab0}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    @media(max-width:950px){aside{position:static;width:auto}main{margin:0;padding:24px}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <aside><div class="brand"><span>◆</span> FundOS</div><div class="brand-note">投资组合运营系统</div><label for="product">当前产品</label><select id="product"></select><p class="brand-note" style="margin-top:28px">研究 · 风控 · 投委会 · 复盘<br>所有决策完整留痕</p></aside>
  <main>
    <div class="kicker">PORTFOLIO CONTROL CENTER</div><h1 class="headline" id="title">加载中</h1><div><span class="pill" id="status">—</span> <span class="muted" id="version"></span></div>
    <div class="notice" id="disclosure" hidden></div><div class="metrics" id="metrics"></div>
    <nav><button class="tab active" data-tab="overview">组合总览</button><button class="tab" data-tab="research">投研观点</button><button class="tab" data-tab="decision">决策操作</button><button class="tab" data-tab="evidence">证据审核</button><button class="tab" data-tab="risk">风险中心</button><button class="tab" data-tab="committee">投委会</button><button class="tab" data-tab="reviews">业绩复盘</button><button class="tab" data-tab="operations">运行监控</button><button class="tab" data-tab="modelops">AI 运营</button></nav>
    <section id="overview" class="active"></section><section id="research"></section><section id="decision"></section><section id="evidence"></section><section id="risk"></section><section id="committee"></section><section id="reviews"></section><section id="operations"></section><section id="modelops"></section>
  </main>
<script>
const $=s=>document.querySelector(s),pct=v=>v==null?'—':(Number(v)*100).toFixed(2)+'%';
const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async p=>{const r=await fetch(p);if(!r.ok)throw Error(`${p}: ${r.status}`);return r.json()};
const TRIAL_ID='fundos-index-allocation-trial';let productId='',apiKey='';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});
function empty(t){return `<div class="empty">${esc(t)}</div>`}
function table(rows,cols){if(!rows.length)return empty('暂无数据');return `<table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(c[2]?c[2](r[c[0]]):r[c[0]])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
async function apiWrite(path,{body,headers={}}={}){const r=await fetch(path,{method:'POST',headers:{'X-API-Key':apiKey,...(body?{'Content-Type':'application/json'}:{}),...headers},body:body?JSON.stringify(body):undefined});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.detail||`${path}: ${r.status}`);return data}
function actionError(e){console.error(e);alert(`操作失败：${e.message}`)}
function defaultStress(weights){return {broad_shock:Object.fromEntries(weights.map(w=>[w.asset_symbol,w.asset_symbol==='CASH'?0:-0.1]))}}
function renderDecision(research,versions,workflows){
  const drafts=research.filter(r=>r.status==='draft'),finals=research.filter(r=>r.status==='final'),latest=versions.reduce((a,b)=>!a||b.version_number>a.version_number?b:a,null),weights=latest?.weights||[],next=(latest?.version_number||0)+1,today=new Date().toISOString().slice(0,10);
  $('#decision').innerHTML=`<div class="notice">操作密钥只保存在当前页面内存中，并通过 X-API-Key 请求头发送；刷新页面后清空。投委会决策和发布需要 admin 密钥。</div><div class="grid"><div class="card"><h2>操作身份</h2><div class="form"><input id="operatorKey" type="password" autocomplete="off" placeholder="operator 或 admin API Key"><span class="muted">页面不会保存或显示密钥，服务端审计只记录密钥指纹和角色。</span></div><h2 style="margin-top:24px">研究草稿定稿</h2>${drafts.length?drafts.map(r=>`<div class="record"><b>${esc(r.report_id)}</b><div class="muted">${esc(r.as_of_date)} · ${esc(r.summary)}</div><div class="actions"><button class="btn" data-finalize="${esc(r.report_id)}">确认定稿</button></div></div>`).join(''):empty('暂无待定稿研究')}</div><div class="card"><h2>创建候选组合</h2><form id="proposalForm" class="form"><div class="form-row"><input name="version_id" required value="${esc(productId+'-v'+next)}" placeholder="版本 ID"><input name="version_number" required type="number" min="1" value="${next}" placeholder="版本号"></div><div class="form-row"><input name="effective_date" required type="date" value="${today}"><select name="research_report_id" required><option value="">选择已定稿研究</option>${finals.map(r=>`<option value="${esc(r.report_id)}">${esc(r.report_id)} · ${esc(r.as_of_date)}</option>`).join('')}</select></div><textarea name="weights" required placeholder='权重 JSON'>${esc(JSON.stringify(weights.map(w=>({asset_symbol:w.asset_symbol,weight:Number(w.weight)})),null,2))}</textarea><textarea name="rationale" required placeholder="提案依据"></textarea><input name="created_by" required value="portfolio-manager" placeholder="创建人"><button class="btn" type="submit">创建提案</button></form></div></div><div class="card" style="margin-top:16px"><h2>工作流下一步</h2>${workflows.length?workflows.map(w=>{const s=w.run.state,id=w.run.run_id;return `<div class="record"><b>${esc(id)}</b> · ${esc(s)}<div class="muted">${esc(w.proposal?.rationale||'')}</div><div class="actions">${s==='proposed'?`<button class="btn" data-risk="${esc(id)}">执行风控</button>`:''}${s==='risk_passed'?`<button class="btn" data-decision="${esc(id)}" data-approved="true">投委会通过</button><button class="btn danger" data-decision="${esc(id)}" data-approved="false">投委会拒绝</button>`:''}${s==='approved'?`<button class="btn danger" data-publish="${esc(id)}">确认发布</button>`:''}${['published','rejected'].includes(s)?'<span class="muted">流程已结束</span>':''}</div></div>`}).join(''):empty('暂无工作流')}</div>`;
  $('#operatorKey').value=apiKey;$('#operatorKey').oninput=e=>apiKey=e.target.value;
  document.querySelectorAll('[data-finalize]').forEach(b=>b.onclick=async()=>{if(!confirm(`确认定稿研究 ${b.dataset.finalize}？`))return;try{await apiWrite(`/research/${b.dataset.finalize}/finalize`);alert('研究报告已定稿');await load()}catch(e){actionError(e)}});
  $('#proposalForm').onsubmit=async e=>{e.preventDefault();try{const f=new FormData(e.target),body={version_id:f.get('version_id'),product_id:productId,version_number:Number(f.get('version_number')),effective_date:f.get('effective_date'),weights:JSON.parse(f.get('weights')),research_report_id:f.get('research_report_id'),rationale:f.get('rationale'),created_by:f.get('created_by')};await apiWrite('/proposals',{body});alert('候选组合已创建');await load()}catch(e){actionError(e)}};
  document.querySelectorAll('[data-risk]').forEach(b=>b.onclick=async()=>{const provider=prompt('行情提供方','fundos-trial-normalized');if(!provider)return;const scenario=prompt('压力情景 JSON',JSON.stringify(defaultStress(weights),null,2));if(!scenario)return;try{await apiWrite(`/workflows/${b.dataset.risk}/risk-review`,{body:{provider,as_of_date:today,stress_scenarios:JSON.parse(scenario)}});alert('风险审查已完成');await load()}catch(e){actionError(e)}});
  document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=async()=>{const approved=b.dataset.approved==='true',rationale=prompt(approved?'请输入通过依据':'请输入拒绝依据');if(!rationale||!confirm(`确认${approved?'通过':'拒绝'}该提案？`))return;try{await apiWrite(`/workflows/${b.dataset.decision}/committee-decision`,{body:{approved,rationale,decided_by:'investment-committee'}});alert('投委会决策已记录');await load()}catch(e){actionError(e)}});
  document.querySelectorAll('[data-publish]').forEach(b=>b.onclick=async()=>{if(!confirm('发布将创建正式组合版本并写入调仓记录，确认继续？'))return;try{await apiWrite(`/workflows/${b.dataset.publish}/publish`,{headers:{'Idempotency-Key':`dashboard-publish-${b.dataset.publish}`}});alert('组合版本已发布');await load()}catch(e){actionError(e)}});
}
function drawNav(canvas,rows){if(!rows.length)return;const vals=[...rows].reverse().map(x=>Number(x.nav)),dpr=devicePixelRatio||1,w=canvas.clientWidth,h=270,lo=Math.min(...vals),hi=Math.max(...vals),span=hi-lo||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);c.strokeStyle='#73d7c6';c.lineWidth=2;c.beginPath();vals.forEach((v,i)=>{const x=18+i*(w-36)/Math.max(1,vals.length-1),y=18+(hi-v)*(h-36)/span;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}
function disclosure(){const trial=productId===TRIAL_ID,el=$('#disclosure');el.hidden=!trial;el.textContent=trial?'历史模拟业绩：基于基金复权净值，基金运营费用已反映在净值中；未扣申购、赎回及调仓成本，现金按零收益处理。不代表实盘或未来可实现收益。':''}
async function load(){
  disclosure();
  const [detail,versions,perf,research,reviews,pipelines,modelSummary,modelCalls,workflows,rawEvidence,jobRuns,jobLocks]=await Promise.all([api(`/products/${productId}`),api(`/products/${productId}/versions`),api(`/products/${productId}/performance`),api(`/products/${productId}/research`),api(`/products/${productId}/reviews`),api('/pipeline-runs?limit=10'),api('/model-calls/summary?days=30'),api('/model-calls?limit=20'),api(`/products/${productId}/workflows`).catch(()=>[]),api('/research-evidence').catch(()=>null),api('/scheduled-jobs/runs?limit=20'),api('/scheduled-jobs/locks')]);
  const published=versions.find(v=>v.status==='published'),snap=perf.snapshots[0],m=detail.investment_mandate,pipeline=pipelines[0];
  $('#title').textContent=detail.product.name;$('#status').textContent=productId===TRIAL_ID?'受控试运行':published?'已发布':'未发布';$('#status').classList.toggle('simulation',productId===TRIAL_ID);$('#version').textContent=`当前版本 ${published?'V'+published.version_number:'—'} · 基准 ${detail.product.benchmark_symbol}`;
  $('#metrics').innerHTML=[['累计收益',pct(snap?.cumulative_return)],['基准收益',pct(snap?.benchmark_return)],['超额收益',pct(snap?.excess_return)],['最大回撤',pct(snap?.maximum_drawdown)],['风险等级',m?.risk_level||'—'],['数据截至',snap?.as_of_date||pipeline?.completed_at?.slice(0,10)||'—']].map(x=>`<div class="metric"><span class="muted">${x[0]}</span><b>${esc(x[1])}</b></div>`).join('');
  const weights=published?.weights||[];$('#overview').innerHTML=`<div class="grid"><div class="card"><h2>组合净值</h2>${perf.nav.length?'<canvas id="navChart"></canvas>':empty('暂无净值数据')}</div><div class="card"><h2>当前资产配置</h2>${weights.map(w=>`<div style="margin:13px 0"><div>${esc(w.asset_symbol)} <b style="float:right">${pct(w.weight)}</b></div><div class="bar"><i style="width:${Number(w.weight)*100}%"></i></div></div>`).join('')||empty('暂无已发布配置')}</div></div><div class="card" style="margin-top:16px"><h2>投资说明书</h2><p>${esc(m?.objective||'暂无')}</p>${m?table([{a:m.max_single_asset_weight,b:m.min_cash_weight,c:m.max_turnover,d:m.maximum_stress_loss}],[['a','单资产上限',pct],['b','最低现金',pct],['c','最大换手',pct],['d','压力损失上限',pct]]):''}</div>`;if(perf.nav.length)drawNav($('#navChart'),perf.nav);
  $('#research').innerHTML=research.length?`<div class="stack">${research.map(r=>`<article class="record"><div class="muted">${esc(r.as_of_date)} · ${esc(r.market_regime)} · 置信度 ${pct(r.confidence)}</div><h3>${esc(r.summary)}</h3>${table(r.asset_views,[['asset_symbol','资产'],['direction','方向'],['confidence','置信度',pct],['thesis','逻辑']])}</article>`).join('')}</div>`:empty('暂无研究报告');
  renderDecision(research,versions,workflows);
  $('#evidence').innerHTML=rawEvidence===null?empty('证据审核需要管理员 API 权限，请使用管理 API 或命令行完成审核'):rawEvidence.length?`<div class="stack">${rawEvidence.map(e=>`<article class="record"><div class="muted">${esc(e.published_at)} · ${esc(e.source_name)} · ${esc(e.review_status)}</div><h3><a href="${esc(e.url)}" target="_blank" rel="noreferrer" style="color:#73d7c6">${esc(e.title)}</a></h3><p>${esc(e.content)}</p><p class="muted">资产：${esc(e.asset_symbols.join(', '))} · SHA-256：${esc(e.content_sha256)}</p>${e.reviewed_by?`<p>审核：${esc(e.reviewed_by)} · ${esc(e.review_note)}</p>`:''}</article>`).join('')}</div>`:empty('原始证据库暂无记录');
  $('#risk').innerHTML=workflows.length?`<div class="stack">${workflows.map(w=>`<article class="record"><h3>${esc(w.run.run_id)} · ${esc(w.run.state)}</h3>${table(w.risk_checks,[['rule_code','规则'],['passed','通过',v=>v?'是':'否'],['actual_value','实际值'],['limit_value','限制'],['message','说明']])}</article>`).join('')}</div>`:empty('暂无风险审查记录');
  const decisions=workflows.filter(w=>w.committee_decision).map(w=>w.committee_decision);$('#committee').innerHTML=decisions.length?table(decisions,[['run_id','运行 ID'],['decision','决策'],['rationale','依据'],['decided_by','决策人'],['created_at','时间']]):empty('暂无投委会决策');
  $('#reviews').innerHTML=reviews.length?`<div class="stack">${reviews.map(r=>`<article class="record"><div class="muted">${esc(r.period_start)} — ${esc(r.period_end)}</div><h3>实际 ${pct(r.actual_return)} · 不调仓 ${pct(r.counterfactual_return)} · <span class="${r.rebalance_effect>=0?'positive':'negative'}">调仓效果 ${pct(r.rebalance_effect)}</span></h3><p>${esc(r.summary)}</p><p class="muted">改进：${esc(r.lessons)}</p></article>`).join('')}</div>`:empty('暂无复盘报告');
  const latestJob=jobRuns[0],activeLocks=jobLocks.filter(x=>x.active),failedJobs=jobRuns.filter(x=>['failed','abandoned'].includes(x.status)).length,latestPipeline=pipelines[0];$('#operations').innerHTML=`<div class="metrics"><div class="metric"><span class="muted">最近调度</span><b>${esc(latestJob?.status||'—')}</b></div><div class="metric"><span class="muted">最近管道</span><b>${esc(latestPipeline?.status||'—')}</b></div><div class="metric"><span class="muted">活动租约</span><b>${activeLocks.length}</b></div><div class="metric"><span class="muted">异常运行</span><b class="${failedJobs?'negative':''}">${failedJobs}</b></div></div><div class="grid"><div class="card"><h2>调度运行记录</h2>${table(jobRuns,[['started_at','开始时间'],['job_name','任务'],['status','状态'],['completed_at','完成时间'],['message','说明']])}</div><div class="card"><h2>当前活动租约</h2>${table(activeLocks,[['job_name','任务'],['acquired_at','获取时间'],['lease_until','租约截止']])}</div></div><div class="card" style="margin-top:16px"><h2>生产管道记录</h2>${table(pipelines,[['started_at','开始时间'],['status','状态'],['price_rows_written','行情行数'],['successful_steps','成功步骤'],['failed_steps','失败步骤'],['error_summary','错误摘要']])}</div>`;
  const tokens=Number(modelSummary.input_tokens||0)+Number(modelSummary.output_tokens||0);$('#modelops').innerHTML=`<div class="metrics"><div class="metric"><span class="muted">30 天调用</span><b>${modelSummary.total_calls}</b></div><div class="metric"><span class="muted">成功率</span><b>${pct(modelSummary.success_rate)}</b></div><div class="metric"><span class="muted">Token</span><b>${tokens.toLocaleString()}</b></div><div class="metric"><span class="muted">预估成本 USD</span><b>$${Number(modelSummary.estimated_cost_usd||0).toFixed(4)}</b></div></div><div class="card"><h2>最近模型调用</h2>${table(modelCalls,[['created_at','时间'],['purpose','用途'],['provider','提供商'],['model','模型'],['status','状态'],['latency_ms','延迟',v=>v+'ms'],['error_message','错误']])}</div>`
}
async function init(){try{const products=await api('/products');if(!products.length){$('#title').textContent='尚未创建投资组合';$('#metrics').innerHTML='';$('#overview').innerHTML=empty('请先创建产品');return}const preferred=products.find(p=>p.product_id===TRIAL_ID)||products[0];$('#product').innerHTML=products.map(p=>`<option value="${esc(p.product_id)}">${esc(p.name)}${p.product_id===TRIAL_ID?' · 真实数据试用':''}</option>`).join('');productId=preferred.product_id;$('#product').value=productId;$('#product').onchange=async e=>{productId=e.target.value;await load()};await load()}catch(e){console.error(e);$('#title').textContent='数据加载失败';$('#overview').innerHTML=empty('请确认 FundOS API 与数据库状态')}}init();
</script>
</body>
</html>
