[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fundos"
version = "0.1.0"
description = "AI investment research and portfolio operating system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2025.1.31",
    "fastapi>=0.110,<0.120",
    "pydantic>=1.10.13,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "coverage>=7.6,<8",
    "httpx>=0.27,<1",
]
observability = [
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
fundos-api = "fundos.api.main:run"

[tool.setuptools.package-data]
"fundos.api" = ["*.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["fundos"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
