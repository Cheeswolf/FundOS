[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fundos"
version = "0.1.0"
description = "AI investment research and portfolio operating system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<0.120",
    "pydantic>=1.10.13,<2",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
fundos-api = "fundos.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]
