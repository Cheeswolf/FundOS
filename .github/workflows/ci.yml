name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests with branch coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report

      - name: Check long-history performance
        run: python scripts/benchmark_history.py --years 20 --assets 6 --max-seconds 5

      - name: Compile sources
        run: python -m compileall -q src scripts

      - name: Check patch whitespace
        run: git diff --check

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: fundos:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fundos_test
          POSTGRES_USER: fundos
          POSTGRES_PASSWORD: postgres-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundos -d fundos_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      FUNDOS_TEST_POSTGRES_URL: postgresql://fundos:postgres-test-password@127.0.0.1:5432/fundos_test
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install PostgreSQL test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,postgres]"

      - name: Run PostgreSQL API integration test
        run: >-
          python -m unittest
          tests.test_postgres_integration
          tests.test_database_contract.PostgresDatabaseContractTests
          -v

      - name: Drill native PostgreSQL backup and restore
        env:
          PGPASSWORD: postgres-test-password
          FUNDOS_DATABASE_URL: postgresql://fundos:postgres-test-password@127.0.0.1:5432/fundos_test
          FUNDOS_RESTORE_DATABASE_URL: postgresql://fundos:postgres-test-password@127.0.0.1:5432/fundos_restore
        run: |
          python scripts/backup_postgres.py --destination /tmp/fundos-backups
          createdb --host=127.0.0.1 --port=5432 --username=fundos fundos_restore
          backup_file="$(find /tmp/fundos-backups -name '*.dump' -type f -print -quit)"
          python scripts/drill_postgres_restore.py "$backup_file" --confirm-empty-target
